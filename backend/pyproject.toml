[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-assistant"
version = "0.1.0"
description = "A FastAPI application for EV Assistant"
authors = [{ name = "David Cerdeiro Gallardo", email = "davidcergall22@gmail.com" }]

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "langchain-groq"
]